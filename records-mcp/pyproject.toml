[project]
name = "clinician-records-mcp"
version = "0.1.0"
description = "Standalone read-only clinician records MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinician_records"]

[project.scripts]
clinician-records = "clinician_records.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
