# Records-MCP local OTLP collector (validate with scripts/validate_collector_config.sh).
# Host OTLP HTTP is published on 127.0.0.1:4328 to avoid clashing with agent-service.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  attributes/remove_sensitive:
    actions:
      - {key: patient_id, action: delete}
      - {key: user.id, action: delete}
      - {key: enduser.id, action: delete}
      - {key: authorization, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.response.header.authorization, action: delete}
      - {key: prompt, action: delete}
      - {key: completion, action: delete}
      - {key: record_content, action: delete}
      - {key: tool_arguments, action: delete}
      - {key: tool_result, action: delete}
      - {key: mcp.arguments, action: delete}
      - {key: mcp.result, action: delete}
      - {key: exception.message, action: delete}
      - {key: exception.stacktrace, action: delete}
  transform/strip_url_query:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.url"], "\\?.*", "") where attributes["http.url"] != nil
          - replace_pattern(attributes["url.full"], "\\?.*", "") where attributes["url.full"] != nil
    log_statements:
      - context: log
        statements:
          - replace_pattern(attributes["http.url"], "\\?.*", "") where attributes["http.url"] != nil
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 128
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [memory_limiter, attributes/remove_sensitive, transform/strip_url_query, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/remove_sensitive, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors:
        [memory_limiter, attributes/remove_sensitive, transform/strip_url_query, batch]
      exporters: [debug]
